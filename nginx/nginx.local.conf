# File: nginx/nginx.local.conf
# Purpose: HTTP-only nginx config for local end-to-end testing.
# Functionality: Listens on port 80 and proxies every request straight to the
# Fastify app. No TLS, no Let's Encrypt — that's what nginx.conf is for in
# production.
# Role: Mounted by docker-compose.dev.yml so the stack can be exercised on
# localhost without needing real certificates.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 5M;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream prode_app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
      proxy_pass http://prode_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }
  }
}
