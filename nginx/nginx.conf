# File: nginx/nginx.conf
# Purpose: Reverse proxy that terminates TLS for prode.carestino.com and
# forwards every request to the Fastify container.
# Functionality:
#   - Port 80 keeps the ACME http-01 challenge endpoint open and redirects
#     everything else to HTTPS.
#   - Port 443 serves the app over TLS using the Let's Encrypt certs
#     issued via certbot's webroot plugin.
# Role: Mounted read-only into the nginx container by docker-compose.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  # Sensible defaults.
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 5M;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream prode_app {
    server app:3000;
    keepalive 32;
  }

  # ---------- HTTP --------------------------------------------------------
  # Serves the ACME challenge and redirects everything else to HTTPS.
  server {
    listen 80;
    listen [::]:80;
    server_name prode.carestino.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------- HTTPS -------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name prode.carestino.com;

    ssl_certificate     /etc/letsencrypt/live/prode.carestino.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prode.carestino.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Forward everything to the Fastify app. Fastify serves both /api and
    # the SPA static files itself, so no path-based split is needed here.
    location / {
      proxy_pass http://prode_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
    }
  }
}
