# File: nginx/nginx.bootstrap.conf
# Purpose: Temporary nginx config used during the very first deploy, before
# Let's Encrypt has issued the certificates referenced by `nginx.conf`.
# Functionality: Listens only on port 80 and responds to ACME http-01
# challenges + a small placeholder. Swap with `nginx.conf` after the cert
# is issued (see README "Despliegue").
# Role: Mount this file at /etc/nginx/nginx.conf for the bootstrap step;
# never used in steady state.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    listen [::]:80;
    server_name prode.carestino.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 200 "Configurando HTTPS…\n";
      add_header Content-Type text/plain;
    }
  }
}
