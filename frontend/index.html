<!doctype html>
<!--
  File: frontend/index.html
  Purpose: Entry HTML document served by Vite (dev) and bundled into the
  static output (production).
  Functionality: Preloads Montserrat from Google Fonts, declares the
  Argentina-Spanish language and theme color, and mounts the React app
  by loading `/src/main.tsx` as a module into `<div id="root">`.
  Role: First file the browser receives; everything else is loaded via
  the script tag below.
-->
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no prevents iOS Safari from
         auto-zooming when the user focuses a small input. Sacrifices the
         pinch-to-zoom accessibility affordance on purpose. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EE5A1F" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- iOS home-screen icon: required for the shortcut to show our logo
         instead of a generic letter screenshot. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Prode Carestino" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Prode Carestino — Mundial 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
